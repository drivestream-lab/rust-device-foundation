[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/platform-mac",
    "crates/platform-linux",
    "crates/bin",
]
default-members = ["crates/bin"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Drivestream Lab"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
