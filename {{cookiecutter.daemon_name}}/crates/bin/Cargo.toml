[package]
name = "{{ cookiecutter.daemon_name | replace('-', '_') }}"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "{{ cookiecutter.daemon_description }}"

[[bin]]
name = "{{ cookiecutter.daemon_name }}"
path = "src/main.rs"

[dependencies]
device_core = { path = "../core" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
device_platform_mac = { path = "../platform-mac" }

[target.'cfg(target_os = "linux")'.dependencies]
device_platform_linux = { path = "../platform-linux" }
